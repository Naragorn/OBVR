; OBNG-test.ini for OBVR single-pass stereo (tools/hand-scripts/single-pass-one.txt): the stereo draw
; route on with two eyes, the eye data from OBVR (StereoTestEyeShift=0), the view re-apply. Run with
; ../OBNG/tools/shadow-run.sh --ini tools/hand-scripts/single-pass-obng.ini tools/hand-scripts/single-pass-one.txt --headless
[Shadow]
TimeInfoUpdate=0
TimeInfoInit=0
TimeInfoFreeze=0
TimeInfoUnfreeze=0
LoadingMenuTick=0
LoadingMenuCtor=0
RangeWalk=0
[Route]
RangeWalk=0
StereoDraw=1
StereoEyes=2
StereoTestEyeShift=0
StereoReapply=view
[Probe]
FpuControlWord=0
HavokPlanner=0
CallCounters=0
Memory=1
[Log]
MismatchLines=20
SummaryEverySeconds=10
SummaryTimer=1
