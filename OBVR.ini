; OBVR 0.0.2 - Konfiguration
;
; Diese Datei gehoert neben Oblivion.exe.

[Camera]
; Setzt den Kamera-Hook. 0 laesst Oblivion voellig unveraendert und ist der
; schnelle Weg zu pruefen, ob ein Problem von OBVR kommt.
; Wird nur beim Start gelesen.
HookEnabled=1

[Head]
; Woher die Kopfrotation kommt:
;   none       keine Zusatzrotation, Vanilla-Kamera
;   fixed      feste Winkel aus dieser Datei
;   simulated  langsame Kopfbewegung, zum Pruefen ohne Headset
;   openxr     echtes Headset (noch nicht angebunden, verhaelt sich wie none)
Source=fixed

; Feste Winkel in Grad, fuer Source=fixed.
; Die Achsen sind im laufenden Spiel bestaetigt.
FixedPitch=0.0
FixedRoll=20.0
FixedYaw=0.0

; Ausschlag und Dauer der simulierten Kopfbewegung, fuer Source=simulated.
; Der Pitch laeuft mit doppelter Frequenz, damit eine Figur statt einer
; geraden Linie entsteht.
SimulatedYawDegrees=25.0
SimulatedPitchDegrees=12.0
SimulatedPeriodFrames=600

[Debug]
; Schreibt alle N Frames eine Zeile nach OBVR.log. 0 schaltet das ab;
; Wechsel zwischen First und Third Person werden trotzdem gemeldet.
LogEveryFrames=0

; Liest die [Head]- und [Debug]-Werte alle N Frames neu ein. 0 schaltet das ab.
; Damit lassen sich Winkel und Quelle im laufenden Spiel aendern, ohne
; Oblivion neu zu starten und einen Spielstand zu laden.
ReloadEveryFrames=120
