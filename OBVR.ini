; OBVR 0.0.4 - configuration
;
; This file belongs next to OBVR.dll, that is in Data/OBSE/Plugins, or next to
; Oblivion.exe. The plugin directory is looked at first, which is what makes
; the mod work under Mod Organizer 2 without the Root Builder plugin.

[Camera]
; Installs the camera hook. 0 leaves Oblivion completely untouched and is the
; quick way to check whether a problem comes from OBVR.
; Only read at startup.
HookEnabled=1

[Head]
; Where the head rotation comes from:
;   none       no additional rotation, vanilla camera
;   fixed      fixed angles from this file
;   simulated  slow head movement, for checking without a headset
;   openvr     real headset through SteamVR
;   openxr     real headset through OpenXR (not wired up yet, behaves like none)
;
; openvr needs the x86 build of openvr_api.dll next to Oblivion.exe. SteamVR
; ships it under bin/win32/ - the x64 build that comes with most games will
; not load into Oblivion, which is a 32-bit process.
;
; If SteamVR is not running or the library is missing, OBVR falls back to the
; vanilla camera and says so in OBVR.log instead of failing to start. That
; fallback is what makes openvr a safe default: on a machine without a headset
; Oblivion plays exactly as it did before.
Source=openvr

; Key that recenters. Recentering takes the current head pose as the new zero,
; so everything after it is reported relative to that pose. Set 0 to disable.
;
; The value is a Windows virtual-key code, written either in decimal or in hex
; with an 0x prefix - 46 and 0x2E mean the same thing. The full list is at
;
;   https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
;
; A few that vanilla Oblivion leaves unbound, so they will not collide with a
; game action:
;
;   46  (0x2E)  Del          45  (0x2D)  Insert
;   36  (0x24)  Home         35  (0x23)  End
;   33  (0x21)  Page Up      34  (0x22)  Page Down
;   19  (0x13)  Pause        145 (0x91)  Scroll Lock
;   112 (0x70)  F1  through  123 (0x7B)  F12
RecenterKey=46

; Fixed angles in degrees, for Source=fixed.
; The axes have been confirmed in the running game.
FixedPitch=0.0
FixedRoll=20.0
FixedYaw=0.0

; Amplitude and period of the simulated head movement, for Source=simulated.
; Pitch runs at twice the frequency so the motion traces a figure rather than
; a straight line.
SimulatedYawDegrees=25.0
SimulatedPitchDegrees=12.0
SimulatedPeriodFrames=600

; Whether head movement through space reaches the camera, not only head
; rotation - leaning forward, sideways or standing up. Only Source=openvr
; delivers a position; every other source leaves the camera where the game put
; it regardless of this setting.
PositionalTracking=1

; Oblivion units per metre, for converting the head movement.
;
; 69.99125 is the engine figure: the Construction Set wiki gives 21.3 units to
; a foot, and the Creation Kit wiki the exact conversion with 1 unit = 1.428 cm.
;
; Leave this at the documented figure and use HeadMovementScale below to change
; how far leaning moves you. The two do the same arithmetic, but they will stop
; being interchangeable: stereo rendering needs the true units-per-metre for
; the distance between your eyes, and a value inflated to taste would shrink
; the whole world without anything on screen saying why.
UnitsPerMetre=69.99125

; How much further than life your head is allowed to move. 1.0 is one to one:
; move your head 20 cm and the camera moves 20 cm. 2.0 moves it 40 cm.
;
; Above 1.0 the world moves further than the head that moved it, which is the
; mismatch VR comfort normally rests on avoiding - so this is a knob, not a
; recommendation. The reason it is set above 1.0 by default is that OBVR still
; renders a single image rather than one per eye: with no stereo, parallax is
; the only depth cue there is, and a one-to-one lean reads weaker than it will
; once there are two eyes. Expect to want this back near 1.0 once stereo lands.
;
; 1.0 - one to one, which is what it should have been all along.
;
; The path was 1.0, 2.0, 1.7, 2.0, 3.0 and back to 1.0, across five sessions.
; The climbing was real and the explanation for it was wrong twice. It was not
; the missing second eye. OBVR was rendering the world a third too small - it
; read Oblivion's field of view as horizontal when the game means it as a 4:3
; figure - and a world a third too small shrinks its parallax by the same third.
; With the frustum taken from Oblivion's own camera, one to one feels right.
HeadMovementScale=1.0

; How far leaning may displace the camera, in Oblivion units. 0 removes the
; limit. 120 units is about 171 cm of camera travel, which at a
; HeadMovementScale of 3.0 is 57 cm of real leaning - the same physical headroom
; 80 gave at a scale of 2.0, and that is the figure worth holding constant when
; you change the scale.
;
; The point of the limit is not the leaning but everything else: a tracking
; glitch, or simply standing up and walking away, would otherwise drag the
; camera through the nearest wall. Only the length is cut, never the
; direction, so a lean that reaches the limit stops rather than sliding
; sideways.
;
; Raise HeadMovementScale and this has to follow, or the limit quietly becomes
; the thing deciding how far you can lean. With LogEveryFrames on, the log
; reports both the lean applied and the "raw" figure it reached for - a raw
; figure sitting at this value line after line is the limit talking.
MaxLeanUnits=120.0

; The head itself is never smoothed. Easing a tracked head would show you where
; your head was rather than where it is, and in a headset that latency is felt
; directly. What is smoothed is the camera movement OBVR generates itself, in
; the [Look] section below.

[Look]
; Everything in this section applies only while a real headset is delivering
; poses. Without one, Oblivion keeps its own camera exactly as it always had
; it - starting the game without SteamVR changes nothing.

; The game's dialogue camera zoom. 0 replaces SetDialogCamera with a shim
; that keeps exactly one of its two jobs: a third-person player still flips
; into first person when a conversation starts and back when it ends - the
; vanilla dance, which a bare cut of the function turned out to remove - but
; the camera transition whose distance fDlgFocus sets is never started, so
; there is no zoom. 1 restores the vanilla bytes. Hot-reloadable both ways.
DialogZoom=0

; The first-person flip on its own: 1 keeps vanilla's habit of putting a
; third-person player into first person for a conversation and back after
; it, 0 leaves the point of view alone. Only meaningful while DialogZoom=0
; (with the vanilla bytes restored the game does its own dance). Hot-reloads.
DialogFirstPerson=1

; Takes vertical look away from the stick, the mouse and the keyboard.
;
; With a headset on, the head already decides where the camera points. Leaving
; the stick pointed at the same thing gives two answers to one question, and
; the artificial one is what makes people ill: tilting a view that the inner
; ear insists is level is the classic trigger.
;
; 1 = the vertical look no longer tilts the camera. In third person it moves
;     the camera up and down instead, up above the character's head and down
;     towards the feet. In first person it does nothing at all.
; 0 = vanilla behaviour, the stick keeps the tilt.
BlockVerticalLook=1

; How far the vertical look moves the camera in third person, in Oblivion
; units, at full tilt. One value per direction; negative flips that direction,
; 0 leaves only Oblivion's own vertical swing.
;
; Two values because the camera does not start halfway along its travel. It
; sits at head height, so downwards there is exactly one body between it and
; the ground - a limit the character model sets rather than a matter of taste
; - while upwards nothing bounds it at all. A single range sized for looking up
; therefore stops around the hips on the way down.
;
; The down figure is measured, not calculated: at 60 the camera reached roughly
; the character's backside, which puts the feet at about twice that. Trim it if
; your camera ends up under the floor.
;
; Oblivion's third person camera already swings vertically as it tilts, and this
; is added on top of that.
VerticalLookUpRange=60.0
VerticalLookDownRange=120.0

; Whether that vertical movement eases into place rather than following the
; stick one to one, and how quickly it closes the remaining distance per
; second. 0 is the same as switching it off.
;
; Per second, not per frame: at 8 the camera covers about an eighth of what is
; left in each frame at 60 fps, and that same feel is kept at any other frame
; rate.
SmoothVerticalLook=1
VerticalLookSpeed=8.0

; Whether turning left and right eases as well, and how quickly.
;
; Off by default, and deliberately so: turning is the one look control still
; needed for aiming, and easing it puts the camera behind where you asked it to
; be. It is here because smooth panning sits better with some people than an
; instant one.
;
; It does NOT help the world morphing under alternate eyes, which it was once
; suggested for here. Smoothing eases the START and STOP of a turn; it does not
; slow a turn that is already under way. Under alternate eyes the two eyes are
; a frame apart, so what matters is how far the world turns in one frame - and
; at a steady rate that is the same however the turn began. Tried, and it
; changed nothing, which is what the reasoning should have predicted.
SmoothTurning=0
TurnSpeed=12.0

[Render]
; Whether OBVR renders to the headset, rather than only reading head poses
; from it. 0 is everything up to 0.0.4: the camera follows your head and the
; picture stays on the monitor.
;
; This is not a small switch. Submitting a frame requires registering with
; SteamVR as the *scene* application, and only one application can be that at
; a time - so switching it on takes the headset away from whatever else was
; showing there. Reading poses needs no such thing, which is why every version
; up to 0.0.4 registered as a background application instead.
;
; It is 1 because it works: a real headset showed the test pattern, with the
; eyes the right way round and the picture the right way up. Set it to 0 as
; the escape hatch if a change here ever breaks the game - head tracking does
; not depend on it.
;
; If OBVR registers as the scene application but cannot reach the compositor,
; it gives the registration back and carries on reading poses. You lose the
; picture, not the head tracking, and the log says so.
;
; Only read at startup. Which kind of application OBVR is registers once with
; SteamVR, and the hot reload deliberately does not change it mid-game.
Enabled=1

; Whether the picture is Oblivion's own frame rather than the generated test
; pattern.
;
; Needs DXVK - Microsoft's Direct3D 9 hands out no Vulkan image, and OpenVR
; takes no Direct3D 9 texture, so without DXVK there is no route between them.
; If DXVK is missing OBVR says so in the log and shows the test pattern instead.
;
; This is mono: Oblivion's picture, the same image to both eyes, no depth
; between them. Rendering the world twice is a separate problem, and doing both
; at once would leave a failure with two possible causes.
;
; On because it works: Oblivion has been seen in both eyes through DXVK. Keeping
; the test pattern reachable is what makes a fault here attributable rather than
; merely visible - if the headset goes black, switching this to 0 says
; immediately whether the compositor path or the game frame path is at fault.
GameFrame=1


; Oblivion's own horizontal field of view, in degrees. A LAST RESORT: OBVR now
; reads Oblivion's own NiCamera frustum, which is what the engine composes its
; matrices from. This is used only when that read fails.
;
; And the answer it gives is the one this setting could not settle: the camera
; reports 1.0231 across, which is tan(37.5) x 0.75 x 16/9 to seven figures - so
; fDefaultFOV is a 4:3 figure, the vertical is held at 60 degrees and the
; horizontal widens to 91.3. GameFovIsFor4x3=1 was right. The Direct3D
; projection matrix says 75.0 and is real, well-formed, and not the view being
; drawn; believing it made the world 1.333 times too small.
;
; The old text follows. OBVR
; now reads the projection matrix off the device and measures the frustum
; directly, and these two settings are used only when that read fails. The log
; says which happened. Left here because a game that draws entirely through
; shaders can leave the fixed-function matrix at identity, and then there is
; nothing to measure.
;
; This has to match
; fDefaultFOV in Oblivion.ini - 75 unless you changed it.
;
; It is read from here rather than from Oblivion's file because the console
; command "fov" overrides the setting at runtime and OBVR cannot see that it
; did. The log prints what was used, so a disagreement is one line away.
;
; Why it matters. OBVR gives each eye a texture covering that eye's whole field
; of view - about 89 degrees across and down - and lays Oblivion's frame inside
; it at the size the frame's own angle entitles it to. Without knowing that
; angle there is nothing to lay it against, and the world comes out magnified
; by whatever ratio two unrelated frustums happen to have.
;
; That is not a hypothetical. Before this setting existed the eye was given a
; fixed 80% of the frame's width and all of its height, which magnified the
; world 1.61 times across and 2.31 times down: far too large, and stretched
; 1.43 times taller than wide. The HUD, which lives at the edges of a 16:9
; frame, was pushed clean out of view.
;
; Set this too high and the world shrinks; too low and it grows. If everything
; looks subtly the wrong size, this is the first number to check.
GameFovDegrees=75.0

; How to read the number above when Oblivion is not rendering at 4:3.
;
; This is an open question, it changes the size of the world by a third, and
; it is here as a switch rather than a decision because nothing found settles
; it. Try both and keep the one that looks right - it is one restart each.
;
;   0  the number is the horizontal field of view at whatever resolution the
;      game is running. At 2560x1440 that is 75 across and 46.7 down.
;   1  the number describes a 4:3 screen; the vertical stays where it was and
;      the horizontal widens with the picture. At 2560x1440 that is 91.3
;      across and 60 down.
;
; At 4:3 the two are identical, which is why the question never had to be
; answered while screens were 4:3, and why the documentation does not answer
; it. The Construction Set wiki says SetCameraFOV "sets the camera's
; horizontal field of view", with the vertical following at 5:4 in degrees -
; and 5:4 in degrees is precisely what a 4:3 image gives at 75 degrees. So the
; documented figure describes a 4:3 screen and says nothing certain about a
; wide one.
;
; What points the other way: the Widescreen Gaming Forum calls Oblivion's
; widescreen support a "perfect implementation ... whose example should be
; studied by all developers", and losing vertical field of view on a wide
; screen is, by their own terms, a fault rather than a perfect implementation.
; That argues for 1. But the page never says it outright, so it stays a switch.
;
; How to tell which is right, from inside the headset. Getting this wrong does
; NOT stretch the picture - both readings keep the shape and change only the
; size, evenly. So look for size, not distortion: doorways, your own hands,
; how far away a person standing next to you feels. With 0 on a wide screen
; the world would be a third too small if 1 is the truth, which reads as
; looking through a window rather than standing there.
;
; 1 also fills much more of the view sideways - 93% of it against 78% - so if
; the black bars at the left and right bother you, that is the setting to try
; first. It is not a way of stretching the picture to fit: if it looks right,
; it is right, and the fuller view is what being right looks like.
GameFovIsFor4x3=1

; Whether the picture is handed to the compositor after Oblivion has drawn it
; rather than before.
;
; 0 is every version up to now, and it costs a whole frame of latency. The
; camera hook fires while the camera is being computed, which is before the
; frame is rendered - so what it submits is whatever the back buffer held from
; last time. On a monitor that is invisible. In a headset it is felt: the world
; lags a fraction behind the head, which is the single thing VR is least
; forgiving about.
;
; 1 hooks IDirect3DDevice9::Present, at method table entry 17, and submits from
; there. By the time Direct3D is asked to show a frame, that frame exists.
;
; This also inverts which eye a copy belongs to under Stereo=aer, and that is
; handled rather than hoped: camera::BackBufferEyeIsLeft takes both facts and
; frame_logic_test pins all four combinations. Getting it wrong shows each eye
; the other eye's viewpoint, which has happened once already and is not subtle.
;
; What it does not fix: under alternate eyes each eye still receives a new
; picture only every second frame. Halving the latency does not double the
; rate, and the flicker that comes from an eye holding a stale image for a
; whole frame is a property of drawing once per frame, not of when the drawing
; is handed over. Only Stereo=dual removes that - by drawing per frame twice.
;
; Stereo=dual additionally requires this to stay on: its captures happen
; mid-frame and the submit pays them at Present. With this off, dual says so
; in the log and renders single-pass.
;
; Set to 0 if the game stops presenting, hangs at a black screen, or the
; picture goes away - that puts everything back to the arrangement that is
; known to work, and the log will say whether the hook went in.
SubmitAtFrameEnd=1

; Whether menus and loading screens reach the headset.
;
; They have no camera, so they arrive flat - the same picture to both eyes,
; with no pose claimed and no depth invented. That is correct for a menu: it
; has no viewpoint to be wrong about, and asserting one would have the
; compositor warp a flat image every time the head moved.
;
; 1 because the alternative is worse than imperfect. Without it the headset
; shows nothing at all while the main menu is up, and after ten frames with no
; submit the compositor falls back to its own Home scene - so loading a save
; means taking the headset off, and what you see meanwhile is somebody else's
; room.
;
; Whether a menu is shown in the world is a separate question, and it has its
; own setting below.
ShowMenus=1

; Where an in-game menu is shown: on the cinema screen, or in the world.
;
;   cinema  the whole frame becomes one flat picture, menu and world together,
;           hanging on a pose held from when it appeared. This is what OBVR
;           has always done and it stays the default - a flat picture is
;           legible in a way a quad at a fixed distance is not, and reading an
;           inventory is what menus are for.
;   world   the world keeps being drawn in stereo and stays where it is, and
;           the menu reaches the headset through the same overlay the HUD uses,
;           hanging in front of it.
;
; Only in-game menus are affected - inventory, the ESC menu, the map, anything
; opened over a world that is still being rendered.
;
; Videos, loading screens and the main menu always take the cinema screen,
; whatever this says. There is no world render behind them for a menu to hang
; in front of, so "in the world" would be a quad floating in an empty room, and
; a screen is better than that. This is decided on whether a world render
; actually happened this frame rather than on a list of menu names, so it
; needs no maintenance when a mod adds a menu.
;
; What "world" costs: a second world render on every menu frame, which the
; cinema screen does not pay. Oblivion is paused behind most menus, so the
; frame rate there matters less than it does in play - but it is not free.
;
; One thing that is deliberate rather than unfinished: Oblivion does not redraw
; the world behind an open menu on every frame. On the frames it does not, OBVR
; sends the last pair of eyes out again rather than falling back to the cinema
; screen - switching between the two at frame rate is exactly what made menus
; appear to snap open and shut in the headset before ShowMenus was taught to
; ask the game whether a menu was up. The picture is not stale: the world is
; paused, so it is still true, and the compositor reprojects it for the head
; movement that did happen.
Menus=world

; (Render.LiveMenuBackground is deliberately not offered here. The code for it
; is in the plugin and works - clearing Oblivion's own bStaticMenuBackground
; copy makes the engine render the world behind menus live, with the
; simulation still paused - but the picture it produces sits offset from where
; the world was a moment earlier, and the whole thing costs two world renders
; per menu frame for a menu background nobody reads. Not worth the frame rate
; until the offset is fixed. See MenuBackground.h and PlaceMenuCamera for
; where to pick it back up; setting the key by hand still switches it on.)

; Overrides Oblivion's own field of view, in degrees. 0 leaves it alone.
;
; Read the way Oblivion reads fDefaultFOV: as a horizontal angle at 4:3, so 80
; here means what 80 would mean in Oblivion.ini. At 2560x1440 that comes out as
; 96.4 degrees across and 64.4 down - measured in the headset, not computed
; here, because the first figure written into this file was wrong.
;
; Written into the camera's frustum rather than into fDefaultFOV, and that is
; the point of it existing. Changing fDefaultFOV also resizes Oblivion's menu
; layer, which leaves mouse clicks landing somewhere other than where the
; buttons appear - a well-known complaint, and one this avoids entirely.
;
; What it buys in the headset is height. A 16:9 frame does not fill a view that
; is nearly square, so the margin above and below shrinks as this rises:
;
;     75   58% of the view filled vertically
;     80   63%
;     85   69%
;     90   75%
;
; What it costs is width that is never seen - the frame is already wider than
; the eye and cropped at the sides - and Oblivion's HUD moving further out
; towards the edges, where the crop eventually reaches it.
GameFovOverride=75.0

; How large menus, videos and loading screens are drawn, as a fraction of the
; world's own placement.
;
; Below 1 puts them at arm's length with black around them, instead of pressed
; against the face at the size of the world. They also carry the head pose now,
; so they hang in the room and the head can look around them - without that
; they rode the head, which is what "VR stops when a dialogue opens" was.
;
; 1.0 fills as much as the world does. Lower is smaller and further away.
;
; This is the distance knob for the cinema screen: the screen sits at optical
; infinity by design (both eyes see it in the same direction, which is what
; makes it fuse as one), so there is no metre value to move - its SIZE is
; what reads as near or far. Note that MenuAspect changed what a given scale
; looks like: the width stays the world placement's width times this, and
; the height follows the aspect, so 16:9 is flatter - and reads further away -
; than the old nearly square picture at the same scale. Raise this to bring
; the cinema closer. Takes effect at the next game start.
MenuScale=0.9

; The paused world behind Esc/Tab menus, which OBVR holds as a frozen stereo
; pair. Vanilla shows that world desaturated and re-toned sepia - the
; yellow-brown static menu background bStaticMenuBackground gives - and
; MenuShade=1 does the same to the held pair: grey out of the picture's own
; luminance, multiplied by MenuShadeColor (RRGGBB hex, the tone), blended
; back towards the original colours by MenuShadeStrength (1 = fully sepia
; like vanilla, 0.5 = half way, 0 = off). A flat brown laid OVER the colours
; was tried first and looked nothing like the game - the desaturation is the
; point. Both values hot-reload; the shade is repainted fresh each time a
; menu opens. Dialogue is untouched: there the world keeps rendering and no
; frame is ever held.
MenuShade=1
MenuShadeColor=FFE3B2
MenuShadeStrength=1.0

; The doubled black bars at the held frame's left and right edges. Each eye's
; picture is cropped at the opposite edge, so each side edge exists in one
; eye only and the eyes cannot fuse it - the top and bottom, whose crops
; match, showed one frame all along. 1 trims each eye's picture to the window
; both eyes show, so all four edges sit at the same angles and fuse into one
; frame. Costs a strip of side view a single eye would have had, only while a
; menu is up. 0 leaves the pictures whole.
MenuSingleBorder=1

; The shape menus, videos and loading screens are given, width over height.
;
; 1.7778 is 16:9 - a screen in front of you rather than a view wrapped around
; your face. The eye's own view is nearly square, and a menu filling it is not
; a cinema, it is a menu pressed against the eyes.
;
; Under UiFollowsFrameSize this is no longer a crop but the shape the 2D is
; GIVEN: the screen-size copy is set to a window of this aspect into the
; frame (the frame's width over this, e.g. 4028x2266 for 16:9), the UI lays
; out, draws and maps its mouse at that shape, and the flat path and the HUD
; overlay show exactly that slice. Nothing is cut, because nothing is drawn
; outside it. The first full-frame run was the reason: with the whole nearly
; square frame as the screen, everything came out 4:3 and the main menu too
; narrow. 0 gives the 2D the whole frame instead. Takes effect at the next
; game start - the copy is written when the device is made.
MenuAspect=1.7778
; The HUD as a picture of its own, hanging in the room.
;
; On world frames the pass that draws Oblivion's 2D layer is redirected into
; a texture OBVR owns - with the alpha channel the back buffer never had -
; and that texture hangs ahead of the head as a compositor overlay. This is
; what puts the HUD back once the world is drawn per eye: under Stereo=dual
; the eye pictures are captured before the interface draws, so without this
; the HUD exists only on the monitor.
;
; World frames only, deliberately. Menus, videos and loading screens keep the
; flat path exactly as before: on those frames the layer stays in the back
; buffer, which is precisely the picture the flat path shows. The redirect,
; the flat decision and the dual pass all ask the game the same question -
; is a menu up - so they cannot disagree about what kind of frame this is.
;
; What to expect with it on: the HUD rides with the head like a cockpit
; instrument, at HudDistanceMetres ahead and HudWidthMetres wide, and it
; leaves the monitor's picture (the monitor shows the world without it).
; Needs SubmitAtFrameEnd=1. Switched on 2026-08-26, after dual pass was
; verified in the game - this is the run that decides whether the redirect
; and the overlay behave. 0 is the one-line way back.
HudOverlay=1

; Whether the 2D layer is taken between the two world renders instead of
; after them. Only does anything under Stereo=dual with HudOverlay=1.
;
; This is the answer to the thing that cost the HUD its draws, measured
; rather than guessed. Rendered once, the 2D pass draws its 21 primitives.
; Rendered twice, the very same pass is entered, walks past every gate with
; all of them open - the interface manager, its root, that root's flags and
; child list, the loading thread, the menu stack - and draws nothing and
; clears nothing. Cut the second render back off and it draws again, in the
; same run, within a second. So whatever the second render leaves behind is
; per frame and heals on its own.
;
; That leaves one moment in a dual frame when the pass demonstrably works:
; after the first render, before the second. Which is exactly where the
; overlay wants it anyway, because the eye pictures are captured just before
; and the layer must not be in them.
;
; The game's own pass still runs afterwards, still draws nothing, and is left
; alone rather than suppressed - the redirect simply declines it, so it
; cannot clear what the earlier one filled.
;
; 0 waits for the game's own pass, which under dual pass means no HUD.
HudBetweenPasses=1
; Where the HUD hangs: on the head, or in the room.
;
;   head   the compositor carries it with the head every frame, so it sits
;          in the same place in the view whatever you look at - a cockpit
;          HUD. This is what the layer's first working run used.
;   world  it is placed in the room and stays there, so turning your head
;          looks past it and turning back finds it again.
;
; With world, the anchor is taken the first time the HUD appears and again
; every time you press the recenter key, levelled to heading only - the same
; treatment the flat menu picture gets, and for the same reason: an anchor
; carrying pitch or roll hangs crooked for as long as it stands.
;
; Turning with the stick does not move it, and that is right rather than a
; shortcoming: the stick turns your character in the world while your head
; has not moved in the room, so a room-anchored quad stays exactly where you
; are still looking. What moves it is you moving. The recenter key brings it
; back.
;
; Hot reloaded, and switching back to head mid-session puts it back on the
; head rather than leaving it hanging.
; 2026-08-28: a whole Dream Air session ran with the HUD and every menu
; "missing" - the world anchor had been taken from the first readable pose,
; which predated the headset being on a head, so the quad hung somewhere the
; wearer never looked. HudAnchor=head proved the overlay path itself fine.
; The anchor now self-heals (retaken whenever it sits more than two metres
; from the head), so world is back on trial.
HudAnchor=world
HudDistanceMetres=1.2
HudWidthMetres=1.6

; The crosshair, given a quad of its own at the depth it is aiming at.
;
; What this fixes is a crosshair that appears twice in the headset, and the
; cause is not a drawing error. The whole 2D interface reaches the headset as
; one flat overlay hung at HudDistanceMetres, the crosshair included - and
; anything outside the plane the eyes are converged on is seen twice. A
; crosshair at 1.2 m laid over a target ten metres away is doubled by the same
; optics that show two fingers when you focus past your own hand.
;
; Aiming itself already follows the head: verified in the game by looking up
; with the head alone, without touching the mouse, and firing an arrow - it
; goes up. Oblivion takes the aim ray from the camera, and OBVR gives the
; camera to the head. Only the crosshair's depth was ever wrong.
;
; What hangs there is Oblivion's OWN crosshair, lifted out of the flat layer
; and erased where it came from, so it is not shown twice at two distances.
; That means the context icons come along - the hand, the lock, the speech
; bubble - and change as you look around. OBVR never has to know what any of
; them mean, which is why this beats anything drawn here. An earlier version
; did draw its own cross; it looked fine and was removed anyway. It is the
; game's crosshair or none.
;
; NEEDS bCrossHair=1 under [GamePlay] in Oblivion.ini. That is the default, so
; usually there is nothing to do - but if it was ever set to 0, there is
; nothing in the middle of the layer to lift and the crosshair is simply
; missing.
;
; CrosshairSourcePixels is how big a square is lifted, centred on the layout
; the game believes it drew in. Too small leaves a few pixels of the flat
; crosshair behind in the middle and clips the context icons, which are larger
; than the plain cross; too large lifts whatever else is near the middle of the
; screen along with it.
;
; CrosshairDistanceMetres is where the quad hangs. Fixed for now; the honest
; version takes the distance the aim ray travels before it hits something, and
; that is the next step. It is worth trying fixed first, because past roughly
; ten metres the sight lines are so nearly parallel that further depth changes
; nothing anyone can see - if a fixed distance already reads as one crosshair,
; the dynamic one is not needed.
;
; CrosshairSizeAtOneMetre is how wide the crosshair would be at one metre. The
; width actually used is that times the distance, which holds the apparent size
; steady however far away the quad is placed - so the number is really an angle
; wearing this section's units. 0.025 is about 1.4 degrees.
Crosshair=0
CrosshairDistanceMetres=10.0
CrosshairSizeAtOneMetre=0.025
CrosshairSourcePixels=96

; Whether Oblivion is made to render the headset's own field of view instead of
; an angle. Overrides GameFovOverride when on.
;
; This is the answer to "why 16:9 at all". Nothing forces it: 16:9 is what
; Oblivion happens to render because that is the shape of a monitor, and the
; black bars above and below are that shape sitting in a view which is nearly
; square. Once OBVR writes the frustum, the two axes can be set independently -
; so they are set to whatever the eyes actually see.
;
; On this headset that is about 98 degrees across and 100 down, taken as the
; union of both eyes: a single picture shared between them has to reach the
; outer edge of both, and the eyes look outwards in opposite directions.
;
; WHAT THIS DOES NOT FIX BY ITSELF, and it matters: the frame is still
; 2560x1440 pixels. Spreading those over a square view stretches them
; vertically - the geometry is right and the resolution is not. For the pixels
; to follow, iSize W and iSize H in Oblivion.ini want to be closer to equal.
; Something like 2048x2048 costs about the same pixel count as 2560x1440 and
; puts them where the eye is looking.
;
; Try it with the resolution unchanged first - the shape will be right and the
; sharpness will suffer - then change the resolution and compare.
;
; Off by default because it changes both the field of view and the sharpness at
; once, and a setting that moves two things is one to reach for deliberately.
MatchHeadsetFov=1

; Whether OBVR sets the size of Oblivion's frame.
;
; Essential for a headset and useless for a monitor, which is why it is here
; rather than left to the game. A headset's view is nearly square; a 16:9 frame
; spread over it stretches the pixels vertically however right the geometry is.
;
; Set where it is decided: OBVR intercepts Direct3DCreate9 through Oblivion's
; import table and then CreateDevice on the factory it returns, which is the
; one moment the size exists as something changeable. One restart, and nothing
; outside the process is touched.
;
; The earlier version wrote iSize into Oblivion.ini and let the game read it
; next time. That was a detour past the place the decision is made, it cost two
; restarts, and it edited a file belonging to the user. If the log says
; Direct3DCreate9 could not be intercepted, the device was already made before
; OBVR loaded and nothing here can reach it.
;
; Width and height of 0 mean whatever the headset asks for - on the Dream Air
; the log says 4028x3380 per eye, which already includes the margin the
; compositor needs for lens distortion. That is the honest answer to "what can
; this headset use", and also a lot of pixels: 13.6 million against 3.7 for
; 2560x1440, twice per frame under the dual pass. Typing explicit numbers
; below that trades sharpness back for frame rate; typing numbers above it is
; further supersampling. Takes effect at the next game start, not on a hot
; reload - the device exists long before the INI is re-read.
;
; ON, after being off for a while, and the history matters because every
; reason it was off has since been answered:
;
;   * "the 2D layer is laid out at the resolution the game believes in" was a
;     suspicion, and the viewport reading x=0..3200 y=0..3200 on menu AND
;     world frames was taken as refuting it. That was too strong: a viewport
;     is only the rectangle drawing MAY land in, not where it did. The first
;     eye-sized run showed exactly the suspected symptoms on parts of the 2D,
;     and Debug.LayoutProbe measured the real answer per part: films and the
;     main menu drew into an exact 2560x1440 corner of the 4028x3380 buffer,
;     the ESC and inventory menus spread over the whole buffer, and the mouse
;     clicked nothing because cursor and hit test no longer meant the same
;     place. Two believed sizes at once - the INI's and the created buffer's.
;     Writing the game's own numbers back into its CreateDevice parameters
;     changed nothing, measured to the pixel: nothing reads that structure
;     back. Moving the belief at its source - rewriting the in-memory iSize
;     settings to the eye size at device creation - was then built and it
;     worked, and the run that proved it ended the attempt: the game crashed
;     in its own fullscreen mode path (offset 0x98749) on a size no monitor
;     has, after the engine had already written the moved values back into
;     the user's Oblivion.ini, which crashed every later start until the
;     file was restored from backup. So the game keeps its own believed
;     size, the flat path crops to that corner, and the in-game menus stay
;     laid out on the full buffer - unclickable until the split can be cut
;     somewhere the engine does not persist.
;   * the unclickable mouse and the crash were one fault, and it is fixed:
;     leaving exclusive fullscreen stopped Direct3D sizing the window, so the
;     window stayed at its creation-time 320x240 while the back buffer was
;     3200x3200 - DXVK built the swapchain at 320x240 and lost the device.
;     CreateDevice now resizes the window itself, before the device is made.
;   * the intro films' missing half was the MenuAspect crop, and MenuAspect
;     has been 0 since.
;
; Since then the frame's picture was upscaled into the eye textures - real
; resolution 2560x1440 per eye, stretched to 4028x3380. With this on, the
; frame IS eye-sized and the copy is one to one.
SetGameResolution=1
GameResolutionWidth=0
GameResolutionHeight=0
; The cut that closes the eye-sized frame's last split, at the place the
; disassembly named. Oblivion's whole 2D - menu layout, films, the 2D
; projection, the cursor checks - reads its screen size from one working
; copy, filled once at window creation from the iSize settings and never
; written back to disk (the INI is saved from the settings themselves; the
; probe-measured split and the banned settings route are in the history
; above). With this on, that copy is raised to the frame's real size at
; CreateDevice time, after the window and display-mode decisions have
; consumed the game's own numbers: everything 2D then lives in the frame's
; own coordinate space, isotropically, and the mouse maps against the same
; size the menus lay out in. Written only when the copy still reads exactly
; what the game asked for; every other outcome logs a "UiSize:" line and
; touches nothing. 0 keeps the game's own screen size (and the cinema crop
; then keeps showing the corner it draws in).
UiFollowsFrameSize=1
; How the two eyes are given different views of the world.
;
;   none  one image to both eyes. Oblivion is in the headset but flat - there
;         is no depth between the eyes, because there is only one picture.
;         This is the setting that has been seen to work.
;   aer   alternate eye rendering. The camera steps to one eye, the frame is
;         drawn once from there, and both eyes are submitted: the drawn one
;         with the picture just made, the other with its own last one out of a
;         copy OBVR keeps. Real depth, without asking the engine to draw the
;         world twice.
;   dual  the world drawn twice per tick, once per eye, by calling the
;         engine's own render function a second time with the camera moved
;         one interpupillary distance over. Both eyes belong to the same
;         moment, drawn from the same pose - the one-frame disparity that
;         defines aer does not exist here, and neither does its ghosting.
;
;         What it costs: the whole render pipeline runs twice per frame -
;         culling, water, HDR - which a 2006 game on modern hardware can
;         afford and which the frame times in the log will confirm or deny.
;
;         The known limit, stated here rather than discovered in the headset:
;         the HUD draws after both passes, into the frame the monitor gets,
;         so it is not in either eye's picture yet. Menus, videos and loading
;         screens still arrive - they come through the flat path, same as
;         under aer. Putting the HUD back into the world is the next piece of
;         work (its own render target, then an overlay), and it was decided
;         before dual pass was built - see HANDOFF.
;
; Both eyes every frame under aer is not an optimisation that was skipped. It
; is the whole shape of the thing, and it was learned the hard way: the first
; attempt submitted one eye per frame and let the compositor keep the other
; eye's last texture. Every call reported success, nothing failed, no error of
; any kind reached the log - and SteamVR faded to Home after about ten frames,
; which is what it does when an application stops delivering. So a single eye
; is a successful call and not a frame. The evidence is
; docs/verification/OBVR-aer-refused.log, and it says so by omission: there is
; nothing in it.
;
; What aer costs is that the two eyes see pictures drawn one frame apart, so
; anything moving quickly carries a disparity that is time rather than
; distance. It is a real artefact. It is also why this is worth trying before
; the harder route: it asks nothing of Gamebryo at all.
;
; It costs one full-screen copy on the GPU per frame as well - the price of
; each eye owning its picture rather than borrowing the back buffer, which the
; game overwrites on the very next frame.
;
; The eye separation comes from the headset - 62 mm on the one this was built
; against - and is converted with UnitsPerMetre rather than with
; HeadMovementScale applied. How far leaning moves you is a preference; how far
; apart two eyes are is not, and scaling it would change the apparent size of
; the world rather than the strength of the leaning.
;
; Only meaningful with GameFrame=1. The test pattern is generated per eye
; already.
;
; aer has been seen in a headset and delivers. Three faults turned up across two
; runs and all three are fixed: each eye was given the other eye's viewpoint, the
; world was magnified, and the picture sat a fifth of the view too low. If dual
; misbehaves, aer is the setting known to work; if everything does, none.
Stereo=dual

; How much further apart than your real eyes the two viewpoints are placed.
; 1.0 uses the separation the headset reports - geometrically true, the world
; at its real scale, and the default.
;
; Raising it is deliberate hyperstereo, the same idea as the "3D depth boost"
; mods for OpenXR: more parallax on everything, more felt depth and object
; separation up close, and a world that reads proportionally smaller - the
; three come as one package, physics does not sell them separately. OBVR
; applies it to the camera before rendering, so unlike the post-hoc DLL mods
; there is no image warping; each eye is genuinely drawn from the wider
; viewpoint.
;
; Useful values are close to 1: the racing and flight sim crowd settled around
; 1.1, and past 1.5 most people trade depth for eye strain. Values are clamped
; to 0.25..4.0; zero, negative or unreadable values fall back to 1.0. Below 1
; works too and flattens the world towards a larger, more distant look.
;
; Hot reloaded with the rest of this file (see ReloadEveryFrames), so it can
; be tuned from inside the headset: edit, save, and the next reload applies
; it. Only meaningful with a stereo mode on; with Stereo=none there is no
; separation to scale.
EyeSeparationScale=1.01

[Debug]
; Writes a line to OBVR.log every N frames. 0 turns it off; switches between
; first and third person are still reported.
LogEveryFrames=0

; Re-reads the [Head] and [Debug] values every N frames. 0 turns it off.
; This allows changing angles and source while the game runs, without
; restarting Oblivion and loading a save.
ReloadEveryFrames=120
; Cuts the dual pass down to a stage, to find which stage loses the GPU.
; The first dual-pass run died with VK_ERROR_DEVICE_LOST on its first world
; frames; this ladder separates the candidates, one run per rung:
;   0  the whole thing (default)
;   1  the world is rendered twice, camera never moved, nothing captured -
;      the headset shows the mono picture
;   2  rendered twice with the camera moved between, still nothing captured
; Hot reloaded, so it can be changed while the game runs - the whole ladder
; can be climbed in one session by editing this while playing.
;
; The ladder was climbed clean on 2026-08-26: eleven thousand frames on rung
; 1, then 2, then the whole thing, with not one device error in the DXVK log
; (docs/verification/OBVR-dual-ladder-pass.log). So every rung works when
; reached warm, and the remaining question about the first run's
; VK_ERROR_DEVICE_LOST is whether a cold start straight into 0 reproduces it
; - or whether it was the same spurious loss the a61f4e0 run saw once
; without any dual pass at all. 0 stays the setting; if a cold start dies
; again, the ladder is right here.
;
;   9  climb the ladder without being asked to. The rung changes with the
;      world render count - whole mechanism, then 1, then 2, then the whole
;      mechanism again - and the scene trace logs the rung beside what the
;      2D pass drew that frame. This is what turns "which rung costs the HUD
;      its draws" from three runs of the game into one, and the return to
;      the opening rung at the end is what proves the effect follows the
;      rung rather than the passage of time. Bands are 60 world renders
;      each, starting at 260, so standing still for half a minute covers
;      all four.
;
;   3  no second render at all, and the headset keeps a live mono picture
;      rather than freezing on the last pair of eyes it captured. This is
;      the comparison rung: everything else about the frame stays as it is,
;      only the second render goes.
;
;      Because this file is hot reloaded, 0 and 3 can be swapped while the
;      game runs - stand somewhere, edit, watch, edit back. That is how a
;      camera-dependent effect gets attributed to the dual pass or cleared
;      of it without leaving the spot: water reflections resetting as the
;      head moves is the open one, and if they settle on rung 3 and unsettle
;      on 0, the dual pass owns it.
DualPassProbe=0
; Renders the right eye first and the left eye second, swapping the whole
; order of the dual pass.
;
; A diagnostic for a fault that only shows in one eye. There are two ways for
; that to be true and no way to tell them apart while the order never changes:
; either the first render is the one that goes wrong, or the left eye is. Swap
; the order and they separate - a fault that moves to the other eye belongs to
; the render, a fault that stays put belongs to the eye.
;
; Hot reloaded like the rest of [Debug], so it can be flipped mid-game.
SwapEyeOrder=0
; Paints an opaque red square into the middle of the HUD overlay texture,
; after everything the game drew into it, and starts the redirected pass
; from a half-transparent orange clear issued through the render target
; binding rather than an invisible one. The instruments for a HUD that
; arrives as nothing: the square says the overlay path works and the
; layer's own alpha was what went missing; the orange says the binding
; itself carries pixels. Both also make the first draw of a traced pass
; report the pipeline it ran with. Hot reloaded.
;
; Off since 2026-08-27: the HUD arrived in the headset with both of them
; visible beside it, which is the only report either was waiting for. Turn
; it back on if the layer ever comes back empty - it splits "nothing was
; drawn" from "nothing is being shown" in one run.
;
; 2026-08-28: used once more on the Dream Air, and it did its job again -
; the red square showed with HudAnchor=head, which convicted the world
; anchor rather than the overlay path. Off again.
HudProbe=0

; The aim probe: logs the player's own rotation beside the camera's and the
; head's, a few times a second, for sixty lines.
;
; What it is for. An arrow leaves along the player's rotation, which OBVR never
; writes - it takes the vertical look away from the mouse by replacing the
; camera matrix after the engine computed it, and the player's own pitch is
; left where the mouse put it. So the mouse still aims, invisibly, and the
; arrow ignores where the wearer is looking. Reported from the headset: "the
; arrow does not fly to the crosshair, it flies where the mouse aims".
;
; The fix is to write that pitch from the head - but which way rotX grows, and
; in what units, is not known, and a sign guessed wrong aims at the floor when
; the wearer looks at the sky. So it is measured first.
;
; Sines rather than degrees, because this build has no asin to call. At thirty
; degrees up the sine reads 0.5, so a rotX near +0.524 is radians the same way
; round and one near -0.524 is inverted.
AimProbe=0
; The menu-world probe: on the first few menu frames of each episode, OBVR
; calls the engine's world render itself and logs how many draw calls came
; out ("Menu world probe: ..." in OBVR.log).
;
; The measurement behind keeping the world live in 3D behind pause menus.
; Oblivion stops calling its render entirely while one is up - the scene
; counter stands still across every held run - so a live background means
; renders the engine did not schedule, and whether such a render draws at
; all is not something to reason out: the 2D pass under the dual pass set
; the precedent of a pass that runs to completion and draws nothing. One
; counted render answers it.
;
; Held and cinema menu frames both qualify, because both sit on the same
; stopped engine render. The cinema case is what a run with a sleeping
; headset produces: stereo never arms, so no pair is ever held, and gating
; on held frames alone meant the probe never fired in exactly the runs it
; was meant to measure.
;
; While a probe frame runs, the monitor may show the world instead of the
; menu - that is the probe's render landing in the back buffer, which nobody
; reads on a held frame and which IS the picture on a cinema one. Visible,
; not broken. In the headset a held frame is unaffected: the menu rides its
; own overlay texture. Hot reloaded, so it can be switched on mid-session,
; menu opened, and switched back off.
MenuWorldProbe=0

; The layout probe: measures which rectangle of the frame the 2D actually
; lands in, and logs it ("Layout probe: ..." in OBVR.log) - one measurement
; every couple of seconds while it is on.
;
; The instrument for the eye-sized frame's 2D symptoms (films and the main
; menu sitting small in a corner, in-game menus square and unclickable).
; All of them hang on one unknown: which screen size each part of Oblivion's
; 2D lays out against - the size the game believes from its own INI, or the
; size the frame really is. On a cinema frame the probe boxes the non-black
; pixels of the back buffer; on a held menu frame it boxes what the menu
; pass drew into the layer texture. A box ending near 2560x1440 means that
; part lays out against the believed size; a box ending near the frame's
; full size means it follows the real one.
;
; Each measurement stalls the GPU for its frame, so leave this off outside
; a measuring run. Hot reloaded: switch it on mid-session, visit the thing
; to measure (main menu, Esc menu), and switch it back off.
LayoutProbe=0

; The cursor's side of the same hunt: with the copy raised, clicks land above
; the visible cursor, and the number feeding that offset into the hit test is
; still unfound. While this is on, every couple of seconds one log line
; records the InterfaceManager's cursor position triples, where the cursor
; sprite's node is actually planted, and which tile the game holds the mouse
; over (with where that tile sits). Holding the cursor still on a known
; button turns one line into the whole relationship. Read-only and cheap -
; no GPU stall - but chatty, so off outside a measuring run. Hot reloaded.
CursorProbe=0
