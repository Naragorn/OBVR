; OBVR_Controls.ini - which button does what in Full VR ([Hands] Enabled=1).
;
; Lives beside OBVR.ini (Data/OBSE/Plugins). Changes take effect while the
; game runs, like OBVR.ini's. Every line below starts with ";", so it is off
; and the built-in layout holds. To change one, remove its ";" and write the
; inputs you want after the "=".
;
; Example - the layout before 2026-11-13, the kick on the weapon hand's B and
; the jump on the right stick's flick:
;
;   Kick=RightB
;   Jump=RightStickUp
;
; What you can bind (up to three per action, comma separated; None unbinds it):
;
;   RightA, RightB, LeftA, LeftB        a press
;   RightAHold, RightBHold,             held until the ring over the
;   LeftAHold, LeftBHold                controller fills ([Hands]
;                                       MenuHoldSeconds); a button with a hold
;                                       bound does its press on the release
;   RightStickUp                        the right stick flicked up and back
;                                       (held up it still aims the teleport)
;   RightStickDown                      the right stick flicked down
;   RightStickClick                     the right stick's button held
;                                       (a short click is the hotkey ring)
;   LeftStickClick                      the left stick's button
;                                       (a short click is the spell ring)
;   LeftTrackpad                        the left trackpad's click (Index)
;   LeftABHold                          the left A and B held together a
;                                       second (X and Y on a Quest), the
;                                       ring filling over the controller;
;                                       while both are held neither does
;                                       its own press or hold
;
; "Right" is the weapon hand: left-handed ([Hands] LeftHanded=1) it is the
; left controller. On a Quest / Oculus Touch the left A and B are X and Y.
;
; Each input does one thing. When you give an input to an action, it is taken
; from the action that had it by default (Kick=RightB leaves the jump without
; a button until you give it one). Two lines naming the same input: the first
; action in the list below keeps it. OBVR.log says what came out ("Config:
; buttons ...") and what moved.
;
; Fixed, whatever is written here: walking and turning on the sticks, the
; triggers, the grips, the gestures, the hotkey and spell rings, both sticks
; clicked (OBVR's menu) or held (recenter), and every button inside a game
; menu (B is Tab and back there, the left A drops in the inventory).
;
; Kick needs [Hands] Kick=1; with Kick=0 the flick jumps as well and a Kick
; line here is not used. A kick on a button can be held for a longer kick
; ([Hands] KickHoldMaxSeconds); the flick cannot.

[Buttons]
; Jump: by default the right B (in a menu the right B is back, as Escape).
;Jump=RightB
; Kick: by default the right stick flicked up.
;Kick=RightStickUp
; The pause menu (Escape): by default the left B held.
;PauseMenu=LeftBHold
; The Tab menus: by default the left B.
;Menus=LeftB
; Activate (doors, talking, using) - held while the input is held: the right A.
;Activate=RightA
; Sneak: the right stick flicked down.
;Sneak=RightStickDown
; Ready weapon (the Rest menu with [Hands] Holsters on): the right stick's button held.
;ReadyWeapon=RightStickClick
; Run - held while the input is held, toggled with [Hands] RunToggle: the left stick's button.
;Run=LeftStickClick
; The journal (the game's Quick Menu key): the left trackpad's click.
;Journal=LeftTrackpad
; Switch first / third person: no button by default.
;TogglePov=None
; Quick save (the game's quick save key, F5 - [Hands] QuickSaveKey in
; OBVR.ini): by default the left A and B held together. The game refuses it
; where it always does (it says so on the screen). None frees the two.
;QuickSave=LeftABHold
